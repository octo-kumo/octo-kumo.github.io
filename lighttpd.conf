# lighttpd configuration for yun.ng v2
# Serves static files from /www with clean URL rewriting

server.modules = (
  "mod_indexfile",
  "mod_rewrite",
  "mod_setenv",
  "mod_deflate",
)

server.document-root = "/www"
server.port = 8080
server.username = "lighttpd"
server.groupname = "lighttpd"
server.errorlog = "/var/log/lighttpd/error.log"
server.breakagelog = "/var/log/lighttpd/breakage.log"

# Security: disable directory listing and symlink following
server.dir-listing = "disable"
server.follow-symlink = "disable"

# Security headers
setenv.add-response-header = (
  "X-Content-Type-Options" => "nosniff",
  "X-Frame-Options" => "SAMEORIGIN",
  "Referrer-Policy" => "strict-origin-when-cross-origin",
  "Content-Security-Policy" => "default-src 'self'; script-src 'self' 'unsafe-inline' https://giscus.app https://*.yun.ng https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://giscus.app https://fonts.bunny.net; connect-src 'self' https://giscus.app https://*.yun.ng https://anal.yun.ng https://cloudflareinsights.com https://static.cloudflareinsights.com; frame-src 'self' https://giscus.app; img-src 'self' https: data:; font-src 'self' https://giscus.app https://fonts.bunny.net;",
)

index-file.names = ("index.html")

# MIME types
mimetype.assign = (
  ".html" => "text/html; charset=utf-8",
  ".css"  => "text/css; charset=utf-8",
  ".js"   => "application/javascript; charset=utf-8",
  ".json" => "application/json; charset=utf-8",
  ".xml"  => "application/xml; charset=utf-8",
  ".txt"  => "text/plain; charset=utf-8",
  ".svg"  => "image/svg+xml",
  ".png"  => "image/png",
  ".jpg"  => "image/jpeg",
  ".jpeg" => "image/jpeg",
  ".gif"  => "image/gif",
  ".webp" => "image/webp",
  ".ico"  => "image/x-icon",
  ".woff" => "font/woff",
  ".woff2" => "font/woff2",
  ".ttf"  => "font/ttf",
  ".otf"  => "font/otf",
  ".wasm" => "application/wasm",
  ".pdf"  => "application/pdf",
)

# Clean URL rewriting: if /c/headless doesn't exist as a file,
# try /c/headless/index.html
# This allows serving /c/headless instead of /c/headless/index.html
url.rewrite-if-not-file = (
  "^(/[^?]*[^/])$" => "$1/index.html",
)

# If the URL ends with / and index.html exists, mod_indexfile handles it.
# The rewrite above handles URLs without trailing slash.

# Caching headers for static assets — long TTL since all assets are
# cache-busted with ?v= query params (new build = new URLs)
$HTTP["url"] =~ "\.(css|js|svg|woff2?|ttf|otf|png|jpg|jpeg|gif|webp|ico)$" {
  setenv.add-response-header += (
    "Cache-Control" => "public, max-age=2592000, immutable",
  )
}

# JSON files (search index) — shorter cache
$HTTP["url"] =~ "\.json$" {
  setenv.add-response-header += (
    "Cache-Control" => "public, max-age=86400",
  )
}

# HTML files — no cache (always fresh)
$HTTP["url"] =~ "\.html$" {
  setenv.add-response-header += (
    "Cache-Control" => "no-cache",
  )
}

# Gzip compression
deflate.mimetypes = ("text/html", "text/css", "application/javascript", "application/json", "text/plain", "image/svg+xml")
deflate.min-compress-size = 256

# Note: CORS for /giscus/ CSS files is handled by Cloudflare (adds Access-Control-Allow-Origin: *)
# Do not add CORS headers here — duplicate headers cause browser rejection.
